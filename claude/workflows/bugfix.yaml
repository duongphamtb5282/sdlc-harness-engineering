name: bugfix
description: "Bug fix workflow — diagnose, fix, verify"
trigger_patterns:
  - "fix"
  - "bug"
  - "broken"
  - "not working"
  - "error"
  - "crash"

stages:
  - id: diagnose
    agent: code-reviewer
    model_tier: standard
    gates:
      - id: root-cause
        type: manual
        prompt: "Root cause identified — proceed with fix?"
    outputs:
      - ".sdlc-automation-agent/.orchestrator/diagnosis.md"

  - id: fix
    agent: software-engineer
    model_tier: standard
    depends_on: [diagnose]
    outputs:
      - "**/*.ts"

  - id: verify
    agent: quality-engineer
    model_tier: standard
    depends_on: [fix]
    gates:
      - id: regression
        type: automatic
        condition: "tests_passing"
    outputs:
      - "tests/**/*.spec.ts"

estimated_cost:
  diagnose: "$1.00-3.00"
  fix: "$1.00-3.00"
  verify: "$1.00-2.00"
  total: "$3.00-8.00"
