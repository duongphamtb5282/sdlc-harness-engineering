# Software Engineer — specialist skill registry
# See: skills/_shared/protocols/specialist-skill-loading.md

agent: software-engineer
base_path: skills/_shared/specialist-skills

language_map:
  java: programming-languages/java-kotlin
  kotlin: programming-languages/java-kotlin
  python: programming-languages/python
  typescript: programming-languages/javascript-typescript
  javascript: programming-languages/javascript-typescript
  nodejs: programming-languages/javascript-typescript
  nestjs: programming-languages/javascript-typescript
  go: programming-languages/go
  rust: programming-languages/rust
  csharp: programming-languages/csharp-dotnet
  dotnet: programming-languages/csharp-dotnet
  cpp: programming-languages/cpp
  ruby: programming-languages/ruby
  php: programming-languages/php
  swift: programming-languages/swift
  sql: programming-languages/sql
  bash: programming-languages/shell-bash

stack_map:
  backend: development-stacks/backend
  frontend: development-stacks/frontend
  mobile: development-stacks/mobile
  database: development-stacks/database
  ai: development-stacks/ai-ml-integration
  ai-ml: development-stacks/ai-ml-integration
  realtime: development-stacks/realtime-systems

mode_stack_map:
  frontend: development-stacks/frontend
  mobile: development-stacks/mobile
  ai-ml: development-stacks/ai-ml-integration

always_load:
  - software-engineering/code-quality

delegates:
  frontend: agents/frontend-engineer/SKILL.md
  ai-ml: agents/data-scientist/SKILL.md

# Stack plugin skills — see plugins/AGENT-SKILL-MAP.yaml agents.software-engineer
stack_plugins:
  map: plugins/AGENT-SKILL-MAP.yaml
  protocol: skills/_shared/protocols/stack-skill-loading.md
  go: [stack-golang/golang-how-to, stack-golang/golang-project-layout, stack-golang/golang-testing, stack-golang/golang-error-handling]
  nextjs: [stack-frontend/next-best-practices, stack-frontend/react-best-practices, stack-frontend/shadcn, stack-frontend/react-view-transitions]
  react: [stack-frontend/react-best-practices, stack-frontend/frontend-design, stack-frontend/composition-patterns]
  react-native: [stack-frontend/react-native-skills]
  mobile: [stack-frontend/react-native-skills]
  ai-ml: [stack-frontend/ai-app, stack-frontend/ai-sdk-6, stack-frontend/postgres-semantic-search]
  workflows: [sdlc-workflows/incremental-implementation, sdlc-workflows/test-driven-development]

conditional:
  - skill: software-engineering/performance-optimization
    when: story mentions performance OR nfr.performance OR hot path
  - skill: software-engineering/internationalization
    when: story mentions i18n OR l10n OR locale OR translation
  - skill: domain-applications/saas-platforms
    when: project.domain == saas OR brd mentions multi-tenant
  - skill: domain-applications/e-commerce
    when: project.domain == ecommerce OR brd mentions cart OR payment
  - skill: domain-applications/application-patterns
    when: greenfield scaffold OR new service boundaries
  - skill: domain-applications/communication-systems
    when: story mentions email OR notification OR sms OR webhook
