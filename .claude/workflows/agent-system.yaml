name: agent-system
description: "Autonomous agent system design and implementation"
trigger_patterns:
  - "agent"
  - "autonomous"
  - "multi-agent"
  - "agentic"
  - "ai agent"

stages:
  - id: agent-design
    agent: solution-architect
    model_tier: premium
    gates:
      - id: design-review
        type: manual
        prompt: "Review agent architecture (tools, memory, safety) before implementation"
    outputs:
      - "docs/architecture/agent-architecture.md"

  - id: tool-implementation
    agent: software-engineer
    model_tier: standard
    depends_on: [agent-design]
    outputs:
      - "services/agent/tools/**/*.ts"

  - id: agent-core
    agent: ai-ml-engineer
    model_tier: premium
    depends_on: [agent-design]
    outputs:
      - "services/agent/core/**/*.ts"
      - "services/agent/memory/**/*.ts"

  - id: safety-audit
    agent: security-engineer
    model_tier: premium
    depends_on: [agent-core, tool-implementation]
    gates:
      - id: safety-check
        type: manual
        prompt: "Review agent safety boundaries and tool permissions"
    outputs:
      - "docs/security/agent-safety.md"

  - id: testing
    agent: quality-engineer
    model_tier: standard
    depends_on: [safety-audit]
    outputs:
      - "tests/agent/**/*.spec.ts"

estimated_cost:
  agent-design: "$5.00-8.00"
  tool-implementation: "$3.00-6.00"
  agent-core: "$5.00-10.00"
  safety-audit: "$5.00-8.00"
  testing: "$2.00-4.00"
  total: "$20.00-36.00"
