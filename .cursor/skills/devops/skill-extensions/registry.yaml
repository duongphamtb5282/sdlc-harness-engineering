# DevOps — specialist skill registry (CI/CD, IaC, containers)

agent: devops
base_path: skills/_shared/specialist-skills

cloud_map:
  aws: development-stacks/cloud-platforms
  azure: development-stacks/cloud-platforms
  gcp: development-stacks/cloud-platforms

always_load:
  - software-engineering/devops-cicd
  - tools-integrations/git-workflows

phase_map:
  "2":
    - development-stacks/cloud-platforms
  "3":
    - software-engineering/devops-cicd
    - tools-integrations/automation-scripts
  "5":
    - tools-integrations/monitoring-logging

stack_plugins:
  map: plugins/AGENT-SKILL-MAP.yaml
  protocol: skills/_shared/protocols/stack-skill-loading.md
  system_design: [system-design/observability, system-design/load-balancing, system-design/resilience-failure]
  aws: [stack-aws/core-skills/aws-containers, stack-aws/core-skills/aws-iam, stack-aws/core-skills/aws-cdk, stack-aws/core-skills/aws-cloudformation]
  azure: [stack-azure/azure-architecture, stack-azure/azure-aks, stack-azure/azure-devops]
  vercel: [stack-frontend/deploy-to-vercel, stack-frontend/vercel-cli-with-tokens]
  workflows: [sdlc-workflows/ci-cd-and-automation, sdlc-workflows/shipping-and-launch]

conditional:
  - skill: tools-integrations/development-environment
    when: scaffold devcontainer OR local dev setup
