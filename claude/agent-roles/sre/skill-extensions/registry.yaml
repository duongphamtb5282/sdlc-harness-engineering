# SRE — specialist skill registry

agent: sre
base_path: skills/_shared/specialist-skills

always_load:
  - software-engineering/reliability-engineering
  - tools-integrations/monitoring-logging

stack_plugins:
  map: plugins/AGENT-SKILL-MAP.yaml
  protocol: skills/_shared/protocols/stack-skill-loading.md
  system_design: [system-design/observability, system-design/resilience-failure, system-design/load-balancing]
  aws: [stack-aws/core-skills/aws-observability]
  workflows: [sdlc-workflows/observability-and-instrumentation]

conditional:
  - skill: software-engineering/devops-cicd
    when: deploy monitoring stack OR observability infra
