name: security-review
description: "Security audit workflow — threat model, audit, report, remediate"
trigger_patterns:
  - "security review"
  - "audit"
  - "harden"
  - "penetration test"
  - "vulnerability"

stages:
  - id: threat-modeling
    agent: security-engineer
    model_tier: premium
    outputs:
      - "docs/security/threat-model.md"
      - "docs/security/STRIDE.md"

  - id: code-audit
    agent: security-engineer
    model_tier: premium
    depends_on: [threat-modeling]
    outputs:
      - "docs/security/findings.md"

  - id: remediation
    agent: software-engineer
    model_tier: standard
    depends_on: [code-audit]
    gates:
      - id: fix-critical
        type: automatic
        condition: "no_critical_findings"
    outputs:
      - "**/*.ts"

  - id: verify
    agent: security-engineer
    model_tier: premium
    depends_on: [remediation]
    gates:
      - id: re-scan
        type: manual
        prompt: "Verify all critical findings are resolved"

estimated_cost:
  threat-modeling: "$5.00-10.00"
  code-audit: "$5.00-10.00"
  remediation: "$3.00-6.00"
  verify: "$3.00-5.00"
  total: "$16.00-31.00"
