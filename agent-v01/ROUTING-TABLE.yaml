# Cost-Aware Dispatch Rules
cost_optimization:
  low_cost_threshold: 10  # requests/sec
  medium_cost_threshold: 5
  high_cost_threshold: 2

  queue_behavior:
    low: "Route immediately"
    medium: "Route immediately, check budget"
    high: "Queue if concurrent high-cost agents > 3"

# Priority Override Rules
priority_overrides:
  - condition: "security or compliance in request"
    new_priority: critical
    bypass_queue: true
  - condition: "production incident or outage"
    new_priority: critical
    bypass_queue: true
  - condition: "simple question or lookup"
    new_priority: low
    use_low_cost_model: true
