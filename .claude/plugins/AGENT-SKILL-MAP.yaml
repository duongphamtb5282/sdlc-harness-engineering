# Agent → Plugin Skill Map
# Consumed by agents via skill-extensions/registry.yaml → stack_plugins
# and skills/_shared/protocols/stack-skill-loading.md
#
# Paths are relative to ${CLAUDE_PLUGIN_ROOT}/plugins/{plugin}/skills/

version: "1.0"

plugins:
  sdlc-automation-agent:
    path: .
    install: "claude --plugin-dir /path/to/agents"
    description: Main 13-agent SDLC orchestrator (repo root)

  stack-golang:
    path: plugins/stack-golang
    install: "claude --plugin-dir plugins/stack-golang"
    skill_count: 43

  stack-spring:
    path: plugins/stack-spring
    install: "claude --plugin-dir plugins/stack-spring"
    skill_count: 19
    sources:
      - spring-boot-skills
    note: "Spring Boot 3.x default; Boot 4.x in references/spring-boot-4/; claude-code-java review skills merged"
  stack-vue:
    path: plugins/stack-vue
    install: "claude --plugin-dir plugins/stack-vue"
    upstream:
      - skills
    note: "Vue 3 best practices, Pinia, Router, testing (vuejs-ai/skills)"
  stack-nuxt:
    path: plugins/stack-nuxt
    install: "claude --plugin-dir plugins/stack-nuxt"
    upstream:
      - nuxt-skills
    note: "Nuxt 4+, Nuxt UI/Content/Hub, VueUse, Vite, Vitest (onmax/nuxt-skills)"


  stack-frontend:
    path: plugins/stack-frontend
    install: "claude --plugin-dir plugins/stack-frontend"
    skill_count: 28
    sources:
      - claude-code-nextjs-skills
      - agent-skills-frontend

  stack-aws:
    path: plugins/stack-aws
    install: "claude --plugin-dir plugins/stack-aws"
    skill_count: 52

  stack-azure:
    path: plugins/stack-azure
    install: "claude --plugin-dir plugins/stack-azure"
    skill_count: 191

  sdlc-workflows:
    path: plugins/sdlc-workflows
    install: "claude --plugin-dir plugins/sdlc-workflows"
    skill_count: 24

  agent-toolkit:
    path: plugins/agent-toolkit
    install: "claude --plugin-dir plugins/agent-toolkit"
    skill_count: 43

  delivery-toolkit:
    path: plugins/delivery-toolkit
    description: Install sub-plugins individually (feature-dev, pr-review-toolkit, etc.)

  system-design:
    path: plugins/system-design
    install: "claude --plugin-dir plugins/system-design"
    skill_count: 22
    description: HLD reasoning loop + building blocks (storage, caching, LB, messaging, resilience) with AWS/Azure/GCP variants

  staff-engineer:
    path: plugins/staff-engineer
    install: "claude --plugin-dir plugins/staff-engineer"
    skill_count: 14
    optional: true
    description: Senior staff engineer workflow (TDD, delegation, forensic debugging, worktrees) — alternative to 13-agent SDLC

  claude-skills-catalog:
    path: plugins/claude-skills-catalog
    install: "claude --plugin-dir plugins/claude-skills-catalog"
    skill_count: 66
    description: Extended role skills from claude-skills (Spring Boot, FastAPI, Terraform, Vue, etc.)

# ---------------------------------------------------------------------------
# SDLC agent role → relevant plugins and skills (load 2–5 per dispatch)
# ---------------------------------------------------------------------------

agents:

  product-manager:
    always_plugins: [sdlc-workflows, agent-toolkit]
    skills:
      - plugin: sdlc-workflows
        skills: [spec-driven-development, planning-and-task-breakdown, idea-refine]
      - plugin: agent-toolkit
        skills: [jira, frontend-to-backend-requirements]
    conditional:
      - when: ui-heavy OR frontend in scope
        plugin: stack-frontend
        skills: [web-design-guidelines, frontend-design, composition-patterns]
      - when: greenfield ideation
        plugin: sdlc-workflows
        skills: [doubt-driven-development, source-driven-development]
      - when: greenfield OR architecture scoping OR capacity questions
        plugin: system-design
        skills: [requirements-scoping, back-of-the-envelope]

  solution-architect:
    always_plugins: [system-design, sdlc-workflows, agent-toolkit]
    skills:
      - plugin: system-design
        skills: [system-design, requirements-scoping, back-of-the-envelope]
      - plugin: sdlc-workflows
        skills: [api-and-interface-design, documentation-and-adrs, deprecation-and-migration]
      - plugin: agent-toolkit
        skills: [c4-architecture, database-schema-designer, mermaid-diagrams]
      - plugin: system-design
        skills: [architecture-diagram]
    phase_skills:
      "2":  # HLD / architecture design
        - system-design/system-design
        - system-design/service-decomposition
        - system-design/scaling-evolution
      "4":  # API contracts
        - system-design/api-design
      "5":  # data model
        - system-design/data-storage
        - system-design/consistency-coordination
        - system-design/caching
    conditional:
      - when: messaging OR async OR events
        plugin: system-design
        skills: [messaging-streaming, task-scheduling]
      - when: search OR full-text
        plugin: system-design
        skills: [distributed-search]
      - when: media OR files OR CDN
        plugin: system-design
        skills: [blob-store, content-delivery]
      - when: high availability OR failover
        plugin: system-design
        skills: [resilience-failure, load-balancing, dns]
      - when: observability OR SLO
        plugin: system-design
        skills: [observability, distributed-logging]
    catalog:
      plugin: claude-skills-catalog
      install: claude --plugin-dir plugins/claude-skills-catalog
      phase_skills:
        "2":  # HLD, ADRs, system diagrams
          - architecture-designer
    stack_by_tech_stack:
      java:
        plugin: stack-spring
        skills: [rest-api-conventions, layered-architecture, spring-data-jpa, problem-details-rfc9457]
        packs: [java-spring]
        specialist: [programming-languages/java-kotlin]
        note: "Detect hexagonal-architecture vs layered-architecture from packages — see STACK-RULES.md"
      nodejs:
        plugin: stack-frontend
        skills: [next-best-practices]
      python:
        plugin: stack-frontend
        skills: [ai-app, postgres-semantic-search]
      go:
        plugin: stack-golang
        skills: [golang-project-layout, golang-design-patterns]
      react:
        plugin: stack-frontend
        skills: [react-best-practices, next-best-practices, composition-patterns]
      nextjs:
        plugin: stack-frontend
        skills: [next-best-practices, cache-components, react-view-transitions]
      angular:
        note: Add angular-best-practices pack when available
      aws:
        plugin: stack-aws
        skills: [core-skills/aws-containers, core-skills/aws-iam, core-skills/aws-cdk]
      azure:
        plugin: stack-azure
        skills: [azure-architecture, azure-aks, azure-app-service, azure-key-vault]

  software-engineer:
    always_plugins: [sdlc-workflows]
    skills:
      - plugin: sdlc-workflows
        skills: [incremental-implementation, test-driven-development, debugging-and-error-recovery]
    stack_by_language:
      java:
        plugin: stack-spring
        default_skills: [rest-api-conventions, layered-architecture, spring-data-jpa, problem-details-rfc9457, testing-pyramid]
        on_demand: [hexagonal-architecture, openapi-first, flyway-migrations, spring-security-jwt, oauth2-resource-server, domain-driven-design, spring-ai-integration]
        packs: [java-spring]
        specialist: [programming-languages/java-kotlin]
      go:
        plugin: stack-golang
        default_skills: [golang-how-to, golang-project-layout, golang-error-handling, golang-testing]
        on_demand: [golang-concurrency, golang-grpc, golang-database, golang-observability]
      typescript:
        plugin: stack-frontend
        detect_nextjs: [next-best-practices, react-best-practices, shadcn, react-view-transitions]
        detect_react: [react-best-practices, frontend-design, composition-patterns]
        detect_ai: [ai-sdk-6, ai-app, nextjs-chatbot]
    stack_by_mode:
      frontend:
        plugin: stack-frontend
        skills: [react-best-practices, next-best-practices, shadcn, web-design-guidelines, composition-patterns]
      mobile:
        plugin: stack-frontend
        skills: [react-native-skills]
      backend:
        use: stack_by_language + packs/languages/*
    # Polyglot: Next.js + Java + AWS (see docs/examples/tech-stack-nextjs-java-aws.yaml)
    polyglot:
      when: tech_stack.profile == polyglot OR (packs.language == java-spring AND packs.frontend == nextjs)
      backend:
        packs: [java-spring]
        specialist: [programming-languages/java-kotlin]
        plugins: [stack-spring/rest-api-conventions, stack-spring/spring-data-jpa, stack-spring/problem-details-rfc9457]
      frontend:
        plugins: [stack-frontend/next-best-practices, stack-frontend/react-best-practices, stack-frontend/shadcn, stack-frontend/react-view-transitions]
      cloud:
        plugins: [stack-aws/core-skills/aws-containers, stack-aws/core-skills/aws-iam]
      path_routing:
        backend: "paths.backend → java packs + java-kotlin specialist"
        frontend: "paths.frontend → stack-frontend plugins"
        infra: "paths.infra → stack-aws + packs/clouds/aws"

  quality-engineer:
    always_plugins: [sdlc-workflows, stack-frontend]
    skills:
      - plugin: sdlc-workflows
        skills: [test-driven-development, browser-testing-with-devtools]
      - plugin: stack-frontend
        skills: [chrome-devtools, react-best-practices, web-design-guidelines]
    conditional:
      - when: e2e OR browser tests
        plugin: stack-frontend
        skills: [chrome-devtools]
      - when: ui audit OR accessibility OR ux review
        plugin: stack-frontend
        skills: [web-design-guidelines]
      - when: go project
        plugin: stack-golang
        skills: [golang-testing, golang-benchmark]
      - when: java OR spring OR pom.xml OR build.gradle
        plugin: stack-spring
        skills: [testing-pyramid]
        packs: [java-spring]

  platform-engineer:
    always_plugins: [sdlc-workflows, agent-toolkit, system-design]
    note: "Platform coordination — delegate CI/CD to devops, reliability to sre"
    skills:
      - plugin: sdlc-workflows
        skills: [ci-cd-and-automation, observability-and-instrumentation, shipping-and-launch]
      - plugin: agent-toolkit
        skills: [datadog-cli, dependency-updater]
      - plugin: system-design
        skills: [observability, load-balancing, resilience-failure]
    conditional:
      - when: messaging OR queues OR streaming infra
        plugin: system-design
        skills: [messaging-streaming, task-scheduling]
      - when: CDN OR static assets
        plugin: system-design
        skills: [content-delivery, blob-store]
      - when: search infra
        plugin: system-design
        skills: [distributed-search]
      - when: deploy vercel OR vercel preview OR claimable deployment
        plugin: stack-frontend
        skills: [deploy-to-vercel, vercel-cli-with-tokens]
      - when: vercel costs OR vercel performance OR vercel optimization
        plugin: stack-frontend
        skills: [vercel-optimize]
    cloud:
      aws:
        plugin: stack-aws
        default_skills:
          - core-skills/aws-containers
          - core-skills/aws-iam
          - core-skills/aws-cdk
          - core-skills/aws-cloudformation
          - core-skills/aws-observability
          - core-skills/signing-in-to-aws
        on_demand:
          - core-skills/aws-serverless
          - core-skills/amazon-bedrock
          - specialized-skills/database-skills
      azure:
        plugin: stack-azure
        default_skills: [azure-architecture, azure-aks, azure-devops, azure-key-vault]
        on_demand: [azure-blob-storage, azure-cache-redis, azure-postgresql]

  devops:
    always_plugins: [sdlc-workflows, agent-toolkit, system-design]
    skills:
      - plugin: sdlc-workflows
        skills: [ci-cd-and-automation, shipping-and-launch]
      - plugin: system-design
        skills: [observability, load-balancing]
    cloud:
      aws:
        plugin: stack-aws
        default_skills: [core-skills/aws-containers, core-skills/aws-iam, core-skills/aws-cdk, core-skills/aws-cloudformation]
      azure:
        plugin: stack-azure
        default_skills: [azure-architecture, azure-aks, azure-devops]

  sre:
    always_plugins: [sdlc-workflows, system-design]
    skills:
      - plugin: sdlc-workflows
        skills: [observability-and-instrumentation]
      - plugin: system-design
        skills: [observability, resilience-failure, load-balancing]
      - plugin: stack-aws
        skills: [core-skills/aws-observability]

  security-engineer:
    always_plugins: [sdlc-workflows]
    skills:
      - plugin: sdlc-workflows
        skills: [security-and-hardening]
    cloud:
      aws: { plugin: stack-aws, skills: [core-skills/aws-iam, specialized-skills/security-and-identity-skills] }
      azure: { plugin: stack-azure, skills: [azure-key-vault, azure-security-center, azure-policy] }

  frontend-engineer:
    always_plugins: [stack-frontend, sdlc-workflows]
    skills:
      - plugin: stack-frontend
        skills: [next-best-practices, react-best-practices, shadcn, web-design-guidelines, composition-patterns]
      - plugin: sdlc-workflows
        skills: [incremental-implementation, test-driven-development]

  data-scientist:
    always_plugins: [stack-frontend, sdlc-workflows]
    skills:
      - plugin: stack-frontend
        skills: [ai-app, ai-sdk-6, postgres-semantic-search]

  code-reviewer:
    always_plugins: [sdlc-workflows, delivery-toolkit]
    skills:
      - plugin: sdlc-workflows
        skills: [code-review-and-quality, code-simplification, security-and-hardening]
    delivery_subplugins:
      - pr-review-toolkit
      - code-review
      - security-guidance
    stack_conditional:
      react: { plugin: stack-frontend, skills: [react-best-practices, web-design-guidelines, composition-patterns] }
      nextjs: { plugin: stack-frontend, skills: [next-best-practices, react-view-transitions, web-design-guidelines] }
      react-native: { plugin: stack-frontend, skills: [react-native-skills] }
      go: { plugin: stack-golang, skills: [golang-code-style, golang-lint] }

  compliance-engineer:
    deprecated: true
    redirect: security-engineer
    always_plugins: [sdlc-workflows]
    skills:
      - plugin: sdlc-workflows
        skills: [security-and-hardening]

  technical-writer:
    always_plugins: [sdlc-workflows, agent-toolkit]
    skills:
      - plugin: sdlc-workflows
        skills: [documentation-and-adrs]
      - plugin: agent-toolkit
        skills: [crafting-effective-readmes, mermaid-diagrams, marp-slide, openapi-to-typescript]
      - plugin: stack-frontend
        skills: [writing-guidelines]

  research-advisor:
    always_plugins: [sdlc-workflows, agent-toolkit, system-design]
    skills:
      - plugin: sdlc-workflows
        skills: [context-engineering, idea-refine, using-agent-skills]
      - plugin: agent-toolkit
        skills: [c4-architecture, naming-analyzer]
      - plugin: system-design
        skills: [system-design, requirements-scoping, back-of-the-envelope]
    conditional:
      - when: scale OR capacity OR growth questions
        plugin: system-design
        skills: [scaling-evolution, sharded-counters, sequencer]

# ---------------------------------------------------------------------------
# Recommended plugin bundles per project type
# ---------------------------------------------------------------------------

bundles:
  nestjs-react-aws:
    install:
      - .
      - plugins/system-design
      - plugins/stack-frontend
      - plugins/stack-aws
      - plugins/sdlc-workflows
      - plugins/delivery-toolkit/pr-review-toolkit

  java-spring-azure:
    install:
      - .
      - plugins/system-design
      - plugins/stack-spring
      - plugins/stack-azure
      - plugins/sdlc-workflows
    note: Java conventions in packs/languages/java-spring + stack-spring skills

  java-spring-aws:
    install:
      - .
      - plugins/system-design
      - plugins/stack-spring
      - plugins/stack-aws
      - plugins/sdlc-workflows
    note: Spring Boot backend on AWS

  golang-aws:
    install:
      - .
      - plugins/system-design
      - plugins/stack-golang
      - plugins/stack-aws
      - plugins/sdlc-workflows

  nextjs-ai-fullstack:
    install:
      - .
      - plugins/system-design
      - plugins/stack-frontend
      - plugins/sdlc-workflows

  nextjs-java-aws:
    install:
      - .
      - plugins/system-design
      - plugins/stack-spring
      - plugins/stack-frontend
      - plugins/stack-aws
      - plugins/sdlc-workflows
    config: docs/examples/tech-stack-nextjs-java-aws.yaml
    note: Copy example to docs/architecture/tech-stack.yaml in product repo

  greenfield-architecture:
    install:
      - .
      - plugins/system-design
      - plugins/sdlc-workflows
      - plugins/agent-toolkit
      - plugins/claude-skills-catalog

  staff-engineer-delivery:
    install:
      - plugins/staff-engineer
    note: Optional alternative workflow; does not replace repo-root sdlc-automation-agent unless you choose it explicitly

  minimal-delivery:
    install:
      - .
      - plugins/sdlc-workflows
      - plugins/delivery-toolkit/feature-dev
