description = "Run the pre-launch checklist via parallel fan-out to canonical SDLC agents, then synthesize a go/no-go decision"

prompt = """
Invoke the shipping-and-launch skill.

`/ship` is a **fan-out orchestrator**. It runs three specialist perspectives in parallel against the current change, then merges their reports into a single go/no-go decision with a rollback plan.

## Phase A — Parallel fan-out

Spawn three subagents concurrently via `Agent()`. **Issue all three in a single assistant turn.**

Each subagent loads its canonical SDLC agent plus an absorbed reference playbook (not plugin duplicate personas):

1. **Code Reviewer** — `${CLAUDE_PLUGIN_ROOT}/agents/code-reviewer/SKILL.md` and `${CLAUDE_PLUGIN_ROOT}/agents/code-reviewer/references/general-review-framework.md`. Five-axis review: correctness, readability, architecture, security, performance.
2. **Compliance Engineer (security perspective)** — `${CLAUDE_PLUGIN_ROOT}/agents/security-engineer/SKILL.md` and `${CLAUDE_PLUGIN_ROOT}/agents/security-engineer/references/security-auditor-perspective.md`. OWASP, secrets, auth/authz, dependency CVEs.
3. **Quality Engineer (test perspective)** — `${CLAUDE_PLUGIN_ROOT}/agents/quality-engineer/SKILL.md` and `${CLAUDE_PLUGIN_ROOT}/agents/quality-engineer/references/test-engineer-perspective.md`. Coverage gaps, edge cases, error paths.

Do **not** use duplicate plugin subagents from `plugins/sdlc-workflows/reference/agents/`. See `skills/_shared/protocols/agent-separation.md`.

If subagents are unavailable, run each perspective sequentially in the main context using the same reference files.

Constraints:
- Subagents run in isolated context and return only their report.
- Personas do not delegate to each other — keep the fan-out flat.

## Phase B — Merge in main context

Once all three reports are back, synthesize:

1. **Code Quality** — Aggregate Critical/Important from Code Reviewer + failing tests/lint/build.
2. **Security** — Promote Critical/High Compliance findings to launch blockers.
3. **Performance** — From Code Reviewer performance axis; cross-check Core Web Vitals if applicable.
4. **Accessibility** — Keyboard nav, screen reader, contrast (handle directly or use web-design-guidelines skill).
5. **Infrastructure** — Env vars, migrations, monitoring, feature flags.
6. **Documentation** — README, ADRs, changelog.

## Phase C — Decision and rollback

Produce:

```markdown
## Ship Decision: GO | NO-GO

### Blockers (must fix before ship)
- [Source: Critical finding + file:line]

### Recommended fixes (should fix before ship)
- [Source: Important finding + file:line]

### Acknowledged risks (shipping anyway)
- [Risk + mitigation]

### Rollback plan
- Trigger conditions: [...]
- Rollback procedure: [...]
- Recovery time objective: [...]

### Specialist reports (full)
- [Code Reviewer report]
- [Compliance Engineer report]
- [Quality Engineer report]
```

## Rules

1. Phase A perspectives run in parallel when subagents are available.
2. Personas do not call each other. Main agent merges in Phase B.
3. Rollback plan is mandatory before any GO decision.
4. Critical finding → default NO-GO unless user accepts risk.
5. Skip fan-out only if: ≤2 files, <50 lines, no auth/payments/data/config touch.
"""
