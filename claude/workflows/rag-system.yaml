name: rag-system
description: "RAG system implementation — retrieval, embedding, evaluation, deployment"
trigger_patterns:
  - "rag"
  - "retrieval augmented generation"
  - "vector search"
  - "knowledge base"
  - "semantic search"

stages:
  - id: architecture
    agent: solution-architect
    model_tier: premium
    gates:
      - id: design-review
        type: manual
        prompt: "Review RAG architecture before implementation"
    outputs:
      - "docs/architecture/ADR-rag.md"

  - id: embedding-pipeline
    agent: ai-ml-engineer
    model_tier: standard
    depends_on: [architecture]
    outputs:
      - "services/embeddings/**/*.py"

  - id: retrieval-implementation
    agent: software-engineer
    model_tier: standard
    depends_on: [architecture]
    outputs:
      - "services/rag/**/*.ts"

  - id: evaluation
    agent: quality-engineer
    model_tier: premium
    depends_on: [embedding-pipeline, retrieval-implementation]
    gates:
      - id: retrieval-quality
        type: automatic
        condition: "retrieval_precision > 0.8"
    outputs:
      - "tests/rag/**/*.spec.ts"

  - id: deploy
    agent: platform-engineer
    model_tier: standard
    depends_on: [evaluation]
    outputs:
      - "infra/**/*.tf"

estimated_cost:
  architecture: "$3.00-5.00"
  embedding-pipeline: "$3.00-6.00"
  retrieval-implementation: "$3.00-6.00"
  evaluation: "$3.00-5.00"
  deploy: "$1.00-3.00"
  total: "$13.00-25.00"
