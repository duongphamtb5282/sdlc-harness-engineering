name: greenfield
description: "Full greenfield project delivery — requirements through deployment"
trigger_patterns:
  - "build me a"
  - "create a"
  - "from scratch"
  - "greenfield"
  - "new project"

stages:
  - id: requirements
    agent: product-manager
    model_tier: standard
    gates:
      - id: scope-check
        type: automatic
        condition: "has_clear_requirements"
    outputs:
      - "docs/requirements/brd.md"
      - "docs/requirements/user-stories.md"

  - id: architecture
    agent: solution-architect
    model_tier: premium
    depends_on: [requirements]
    gates:
      - id: design-review
        type: manual
        prompt: "Review architecture design before implementation begins"
    outputs:
      - "docs/architecture/ADR-*.md"
      - "docs/api/openapi.yaml"
      - "docs/architecture/tech-stack.yaml"

  - id: backend
    agent: software-engineer
    model_tier: standard
    depends_on: [architecture]
    outputs:
      - "services/**/*.ts"
      - "libs/**/*.ts"

  - id: frontend
    agent: frontend-engineer
    model_tier: standard
    depends_on: [architecture]
    outputs:
      - "apps/web/**/*.tsx"
      - "apps/web/**/*.ts"

  - id: testing
    agent: quality-engineer
    model_tier: standard
    depends_on: [backend, frontend]
    gates:
      - id: test-plan
        type: automatic
        condition: "coverage > 80%"
    outputs:
      - "tests/**/*.spec.ts"
      - "tests/**/*.e2e.ts"

  - id: review
    agent: code-reviewer
    model_tier: premium
    depends_on: [testing]
    gates:
      - id: review-gate
        type: manual
        prompt: "Code review findings require resolution before deployment"

  - id: security
    agent: security-engineer
    model_tier: premium
    depends_on: [testing]
    gates:
      - id: threat-model
        type: automatic
        condition: "no_critical_findings"

  - id: deploy
    agent: platform-engineer
    model_tier: standard
    depends_on: [review, security]
    gates:
      - id: dod-check
        type: automatic
        condition: "all_critical_findings_resolved"
    outputs:
      - ".github/workflows/deploy.yml"
      - "infra/**/*.tf"

estimated_cost:
  requirements: "$1.00-2.00"
  architecture: "$3.00-5.00"
  backend: "$5.00-10.00"
  frontend: "$5.00-10.00"
  testing: "$2.00-4.00"
  review: "$3.00-5.00"
  security: "$3.00-5.00"
  deploy: "$1.00-2.00"
  total: "$23.00-43.00"
