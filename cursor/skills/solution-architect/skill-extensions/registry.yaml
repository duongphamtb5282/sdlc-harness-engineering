# Solution Architect — specialist skill registry

agent: solution-architect
base_path: skills/_shared/specialist-skills

always_load:
  - software-design/architecture-patterns
  - software-design/system-design

phase_map:
  "2":  # architecture design
    - software-design/design-patterns
  "4":  # API contracts
    - software-design/api-design
  "5":  # data model
    - software-design/data-design
    - development-stacks/database

stack_plugins:
  map: plugins/AGENT-SKILL-MAP.yaml
  protocol: skills/_shared/protocols/stack-skill-loading.md
  system_design:
    orchestrator: system-design/system-design
    phase_2: [system-design/system-design, system-design/service-decomposition, system-design/scaling-evolution]
    phase_4: [system-design/api-design]
    phase_5: [system-design/data-storage, system-design/consistency-coordination, system-design/caching]
    on_demand: [system-design/back-of-the-envelope, system-design/messaging-streaming, system-design/resilience-failure, system-design/load-balancing, system-design/observability]
  go: [stack-golang/golang-how-to, stack-golang/golang-project-layout, stack-golang/golang-design-patterns]
  nextjs: [stack-frontend/next-best-practices, stack-frontend/react-view-transitions]
  react: [stack-frontend/react-best-practices, stack-frontend/composition-patterns]
  aws: [stack-aws/core-skills/aws-containers, stack-aws/core-skills/aws-iam, stack-aws/core-skills/aws-cdk]
  azure: [stack-azure/azure-architecture, stack-azure/azure-aks, stack-azure/azure-key-vault]
  workflows: [sdlc-workflows/api-and-interface-design, sdlc-workflows/documentation-and-adrs]

# Extended catalog skills — plugins/claude-skills-catalog (install alongside repo root)
catalog_plugins:
  map: plugins/AGENT-SKILL-MAP.yaml
  protocol: skills/_shared/protocols/stack-skill-loading.md
  install: claude --plugin-dir plugins/claude-skills-catalog
  base_path: plugins/claude-skills-catalog/skills
  phase_map:
    "2":  # HLD, ADRs, architecture diagrams
      - architecture-designer
  reference_guides:
    architecture-designer:
      - references/adr-template.md
      - references/nfr-checklist.md
      - references/architecture-patterns.md

conditional:
  - skill: software-design/ux-principles
    when: ui-heavy OR frontend in scope OR brd mentions UX
  - skill: development-stacks/cloud-platforms
    when: tech_stack.cloud is set OR deploy target is cloud
  - skill: domain-applications/saas-platforms
    when: project.domain == saas OR multi-tenant in brd
  - skill: domain-applications/e-commerce
    when: project.domain == ecommerce
  - skill: domain-applications/communication-systems
    when: brd mentions messaging OR notifications OR email
