# Quality Engineer — specialist skill registry

agent: quality-engineer
base_path: skills/_shared/specialist-skills

references_path: agents/quality-engineer/references

always_load:
  - software-engineering/testing-strategies

stack_plugins:
  map: plugins/AGENT-SKILL-MAP.yaml
  protocol: skills/_shared/protocols/stack-skill-loading.md
  workflows: [sdlc-workflows/test-driven-development, sdlc-workflows/browser-testing-with-devtools]
  frontend: [stack-frontend/chrome-devtools, stack-frontend/react-best-practices, stack-frontend/web-design-guidelines]
  go: [stack-golang/golang-testing, stack-golang/golang-benchmark]

reference_guides:
  - test-engineer-perspective.md
  - e2e-tester-perspective.md

conditional:
  - skill: tools-integrations/api-tools
    when: contract tests OR openapi OR api integration tests
  - skill: software-engineering/code-quality
    when: testability-review mode OR assessing test quality
  - skill: software-engineering/performance-optimization
    when: performance test phase OR load test story
  - reference: test-engineer-perspective.md
    when: coverage analysis OR test strategy OR /ship test-engineer perspective
  - reference: e2e-tester-perspective.md
    when: e2e OR browser tests OR playwright/cypress scope

language_map:
  java: programming-languages/java-kotlin
  python: programming-languages/python
  typescript: programming-languages/javascript-typescript
  javascript: programming-languages/javascript-typescript
  go: programming-languages/go
