name: ai-ml-service
description: AI/ML service with model serving, RAG pipeline, and monitoring
stack:
  runtime: python-3.12
  framework: fastapi
  model_framework: [pytorch, transformers, vllm]
  tracking: mlflow
  vector_store: [pgvector, qdrant, chroma]
  inference: [vllm, sglang]
  ci: github-actions
  deploy: [aws-sagemaker, azure-ml, gcp-vertex-ai]
