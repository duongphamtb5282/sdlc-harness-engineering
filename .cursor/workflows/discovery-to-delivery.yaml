name: discovery-to-delivery
description: "Full SDLC pipeline: Discover existing codebase → Requirements → Architecture → Stories → Implement → Test → Review → Deploy"
trigger_patterns:
  - "full pipeline"
  - "discovery to delivery"
  - "end to end"
  - "complete sdlc"
  - "from discovery"

stages:
  - id: codebase-discovery
    agent: research-advisor
    model_tier: standard
    description: "Reverse-engineer existing codebase — map architecture, services, dependencies, data models"
    outputs:
      - "docs/architecture/system-map.md"
      - "docs/architecture/service-dependencies.md"
      - ".sdlc-automation-agent/.orchestrator/system-context.yaml"
    gates:
      - id: system-mapped
        type: manual
        prompt: "Review the system map for completeness before proceeding to requirements"

  - id: requirements
    agent: product-manager
    model_tier: standard
    depends_on: [codebase-discovery]
    description: "Gather requirements, define scope, create BRD with epics and user stories"
    outputs:
      - "docs/requirements/brd.md"
      - "docs/requirements/user-stories/*.md"
      - "docs/requirements/acceptance-criteria.md"
    gates:
      - id: brd-approved
        type: automatic
        condition: "all_stories_have_acceptance_criteria"

  - id: architecture-design
    agent: solution-architect
    model_tier: premium
    depends_on: [requirements]
    description: "Design system architecture — ADRs, tech stack, API contracts, data model"
    outputs:
      - "docs/architecture/ADR-*.md"
      - "docs/api/openapi.yaml"
      - "docs/architecture/tech-stack.yaml"
      - "docs/architecture/data-model.md"
    gates:
      - id: arch-approved
        type: manual
        prompt: "Review architecture design (ADRs, API contracts, tech stack) before implementation"

  - id: story-registration
    agent: product-manager
    model_tier: standard
    depends_on: [architecture-design]
    description: "Register user stories with acceptance criteria, link to architecture decisions"
    outputs:
      - ".sdlc-automation-agent/.orchestrator/story-registry.yaml"

  - id: requirements-validation
    agent: product-manager
    model_tier: standard
    depends_on: [story-registration]
    description: "Validate BRD against story registry — check all stories have criteria, all criteria are testable, no orphan stories"
    outputs:
      - ".sdlc-automation-agent/.orchestrator/validation-report.json"
      - ".sdlc-automation-agent/.orchestrator/traceability-matrix.md"
    gates:
      - id: validation-passed
        type: automatic
        condition: "all_validations_pass"

  - id: requirements-archive
    agent: product-manager
    model_tier: fast
    depends_on: [requirements-validation]
    description: "Archive current requirement versions for history tracking"
    outputs:
      - ".sdlc-automation-agent/.orchestrator/story-registry-history/"

  - id: implementation
    agent: software-engineer
    model_tier: standard
    depends_on: [requirements-archive]
    description: "Implement each user story — backend services, frontend components, database changes"
    outputs:
      - "services/**/*.ts"
      - "apps/web/**/*.tsx"
      - "libs/**/*.ts"
    gates:
      - id: story-complete
        type: automatic
        condition: "all_story_acceptance_criteria_met"

  - id: testing
    agent: quality-engineer
    model_tier: standard
    depends_on: [implementation]
    description: "Test implementation — unit, integration, E2E, performance"
    outputs:
      - "tests/**/*.spec.ts"
      - "tests/coverage/lcov.info"
    gates:
      - id: tests-passing
        type: automatic
        condition: "coverage > 80% and all_tests_passing"

  - id: review
    agent: code-reviewer
    model_tier: premium
    depends_on: [testing]
    description: "Code review — correctness, security, performance, architecture conformance"
    outputs:
      - "docs/reviews/review-report.md"
    gates:
      - id: review-approved
        type: manual
        prompt: "Code review findings resolved — approve for deployment?"

  - id: deploy
    agent: platform-engineer
    model_tier: standard
    depends_on: [review]
    description: "Deploy to production — CI/CD, infrastructure, monitoring"
    outputs:
      - ".github/workflows/deploy.yml"
      - "infra/**/*.tf"
      - "docs/runbooks/deployment.md"
    gates:
      - id: dod-met
        type: automatic
        condition: "all_critical_findings_resolved"

estimated_cost:
  codebase-discovery: "$2.00-4.00"
  requirements: "$2.00-4.00"
  architecture-design: "$5.00-10.00"
  story-registration: "$1.00-2.00"
  requirements-validation: "$1.00-2.00"
  requirements-archive: "$0.50-1.00"
  implementation: "$5.00-15.00"
  testing: "$3.00-6.00"
  review: "$3.00-5.00"
  deploy: "$2.00-4.00"
  total: "$23.00-50.00"
