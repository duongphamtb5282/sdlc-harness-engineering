# Platform Engineer — specialist skill registry

agent: platform-engineer
base_path: skills/_shared/specialist-skills

cloud_map:
  aws: development-stacks/cloud-platforms
  azure: development-stacks/cloud-platforms
  gcp: development-stacks/cloud-platforms

always_load:
  - software-engineering/devops-cicd
  - tools-integrations/git-workflows

phase_map:
  "2":  # IaC
    - development-stacks/cloud-platforms
  "3":  # CI/CD
    - software-engineering/devops-cicd
    - tools-integrations/automation-scripts
  "5":  # monitoring
    - tools-integrations/monitoring-logging
    - software-engineering/reliability-engineering

stack_plugins:
  map: plugins/AGENT-SKILL-MAP.yaml
  protocol: skills/_shared/protocols/stack-skill-loading.md
  system_design: [system-design/observability, system-design/load-balancing, system-design/resilience-failure, system-design/messaging-streaming]
  aws: [stack-aws/core-skills/aws-containers, stack-aws/core-skills/aws-iam, stack-aws/core-skills/aws-cdk, stack-aws/core-skills/aws-cloudformation, stack-aws/core-skills/aws-observability]
  azure: [stack-azure/azure-architecture, stack-azure/azure-aks, stack-azure/azure-devops, stack-azure/azure-key-vault]
  vercel: [stack-frontend/deploy-to-vercel, stack-frontend/vercel-cli-with-tokens, stack-frontend/vercel-optimize]
  workflows: [sdlc-workflows/ci-cd-and-automation, sdlc-workflows/observability-and-instrumentation, sdlc-workflows/shipping-and-launch]

delegates:
  devops: agents/devops/SKILL.md
  sre: agents/sre/SKILL.md

conditional:
  - skill: tools-integrations/development-environment
    when: scaffold devcontainer OR local dev setup
  - delegate: devops
    when: cicd OR docker OR terraform OR iac OR deploy pipeline OR container
  - delegate: sre
    when: slo OR error budget OR incident runbook OR chaos OR capacity planning OR on-call
  - stack_plugin: stack-frontend/deploy-to-vercel
    when: deploy vercel OR vercel preview OR claimable deployment
  - stack_plugin: stack-frontend/vercel-optimize
    when: vercel costs OR vercel performance OR vercel optimization
